name: Django CI/CDF

on: 
  push: 
    branches: [main] 
  pull_request: 
    branches: [main]

env: 
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/notes-api
jobs: 
  test: 
    name: Run Django tests 
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: notes
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d notes"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_DB: notes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    steps:
        - name: Get repository code
          uses: actions/checkout@v4

        - name: Set up Python
          uses: actions/setup-python@v5
          with:
            python-version: "3.12"

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        - name: Check migrations
          run: python manage.py makemigrations --check --dry-run

        - name: Run tests
          run: python -m pytest -q

  build: 
      name: Build Docker image 
      needs: test 
      runs-on: ubuntu-latest

      steps:
        - name: Get repository code
          uses: actions/checkout@v4

        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3

        - name: Build Docker image
          uses: docker/build-push-action@v6
          with:
            context: .
            file: ./Dockerfile
            push: false
            tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}

  publish: 
    name: Publish Docker image 
    needs: build 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
    runs-on: ubuntu-latest

    steps:
      - name: Publish is disabled for this exercise
        run: |
          echo "Publish step would push:"
          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Actual registry push is disabled: push=false"
      
  deploy-preview: 
    name: Deploy preview 
    needs: publish 
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' 
    runs-on: ubuntu-latest

    steps:
      - name: Show image that would be deployed
        run: |
          echo "Deploy image:"
          echo "${{ env.IMAGE_NAME }}:${{ github.sha }}"